categories:
  - id: akun
    title: Akun dan login
    questions:
      - q: Mengapa login sekarang meminta kode 6 digit?
        a: Portal memakai autentikasi dua faktor (2FA). Setelah username dan password benar, masukkan kode dari aplikasi authenticator (Google Authenticator, Authy, atau sejenisnya).
      - q: Bagaimana cara mengatur 2FA pertama kali?
        a: Pada login pertama setelah 2FA diaktifkan, pindai QR code yang tampil, lalu masukkan kode 6 digit yang dihasilkan aplikasi. Simpan cadangan secret jika ditampilkan.
      - q: Saya kehilangan aplikasi authenticator. Apa yang harus dilakukan?
        a: "Hubungi sysadmin portal. Sysadmin dapat mereset TOTP dengan perintah ckan security reset_totp <username> lalu Anda mengatur ulang QR code pada login berikutnya."
      - q: Apakah API key juga dilindungi 2FA?
        a: Tidak. Token API CKAN melewati login web. Setelah kebocoran kredensial, semua API key harus dicabut dan password direset. Jangan bagikan API key.
  - id: dataset
    title: Dataset
    questions:
      - q: Bagaimana cara mencari dataset bencana?
        a: Buka menu Dataset, lalu saring dengan facet Jenis Bencana, Fase, Organisasi, atau Format.
      - q: Siapa yang boleh menerbitkan dataset?
        a: Hanya anggota organisasi yang diberi peran editor atau admin. Registrasi mandiri sudah dinonaktifkan.
  - id: harvest
    title: Harvest
    questions:
      - q: Apakah portal bisa harvest data dari portal non-CKAN seperti Satu Data Jakarta?
        a: "Ya, lewat harvester JSON REST. Admin membuat Harvest Source di /harvest, memilih tipe JSON REST, menempel URL JSON detail, lalu mengisi konfigurasi opsional (title, default_tags). Frequency MANUAL memerlukan tombol Reharvest."
      - q: "Kenapa ckan_harvester tidak bisa dipakai untuk API Jakarta?"
        a: "ckan_harvester hanya memahami CKAN Action API (/api/3/action/package_search). Endpoint ws.jakarta.go.id/gateway adalah REST JSON kustom, jadi harus memakai harvester JSON REST. Worker harvest juga harus memuat plugin sdbi_json_harvester."
  - id: peta
    title: Peta BPBD
    questions:
      - q: Apa yang ditampilkan di Peta Sebaran BPBD?
        a: Dua layer administratif (Provinsi dan Kabupaten/Kota) plus titik lokasi BPBD. Klik marker untuk melihat alamat, jumlah SDM, dan tautan Google Maps.
      - q: Bagaimana data SDM BPBD diperbarui?
        a: Sysadmin mengunggah CSV sesuai skema (kode_wilayah, tingkat, nama_instansi, alamat, lat, lng, telepon, email, jumlah_sdm, catatan_sdm) di halaman peta.
  - id: tanggap
    title: Tanggap Darurat
    questions:
      - q: Apa itu kamar dashboard jenis bencana?
        a: Setiap jenis bencana memiliki kamar. Pilih jenis di dropdown untuk melihat dashboard yang sudah di-embed. Kamar yang masih kosong menunggu dashboard produksi dari tim GIS/Superset.
      - q: Bagaimana cara menambahkan dashboard baru?
        a: "Ikuti panduan hosting di /tanggap-darurat/panduan (sysadmin). Dashboard harus HTTPS dan mengizinkan iframe dari portal ini."
