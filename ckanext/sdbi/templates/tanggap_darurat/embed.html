{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block scripts %}{% endblock %}

{% block page %}
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  .embed-frame {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; display: block;
  }
</style>
<iframe
  class="embed-frame"
  src="{{ iframe_src }}"
  title="{{ page_title }}"
  allowfullscreen
></iframe>
{% endblock %}
